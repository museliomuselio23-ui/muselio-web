name: Deploy to Netlify with OIDC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Request OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://api.netlify.com');
            core.setOutput('token', token);
            core.setSecret(token);
            console.log('✅ OIDC token obtained securely');

      - name: Trigger Netlify deployment via Build Hook
        id: deploy
        run: |
          BUILD_HOOK_URL="${{ secrets.NETLIFY_BUILD_HOOK_URL }}"

          if [ -z "$BUILD_HOOK_URL" ]; then
            echo "❌ ERROR: NETLIFY_BUILD_HOOK_URL secret not configured"
            echo "See README for setup instructions"
            exit 1
          fi

          echo "🚀 Triggering Netlify deployment..."
          RESPONSE=$(curl -X POST "$BUILD_HOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"trigger":"github"}' \
            -w "\n%{http_code}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Deployment triggered successfully (HTTP $HTTP_CODE)"
          else
            echo "❌ Failed to trigger deployment (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Deployment status
        if: always()
        run: |
          echo "📋 Deployment workflow completed"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
