<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muselio Admin - Gestion des Œuvres</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --charcoal: #1a1a1a;
            --gold: #d4af37;
            --light-gray: #f5f5f5;
            --dark-gray: #2a2a2a;
            --serif: 'Georgia', 'Garamond', serif;
            --success: #4CAF50;
            --error: #f44336;
        }

        body {
            background: var(--charcoal);
            color: var(--light-gray);
            font-family: var(--serif);
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 1rem;
        }

        header h1 {
            color: var(--gold);
            font-size: 2rem;
        }

        .logout-btn {
            background: var(--error);
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            border-radius: 4px;
            font-family: var(--serif);
        }

        .logout-btn:hover {
            background: #d32f2f;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--charcoal) 0%, var(--dark-gray) 100%);
        }

        .login-box {
            background: var(--dark-gray);
            padding: 3rem;
            border: 2px solid var(--gold);
            border-radius: 8px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-box h2 {
            color: var(--gold);
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }

        .login-box .form-group {
            margin-bottom: 1.5rem;
        }

        .login-box label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--light-gray);
            text-align: left;
        }

        .login-box input {
            width: 100%;
            padding: 0.75rem;
            background: var(--charcoal);
            color: var(--light-gray);
            border: 1px solid var(--gold);
            border-radius: 4px;
            font-family: var(--serif);
        }

        .login-box input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--gold);
        }

        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--gold);
            color: var(--charcoal);
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-family: var(--serif);
            font-size: 1rem;
        }

        .login-btn:hover {
            background: #e5c158;
        }

        .error-message {
            color: var(--error);
            margin-top: 1rem;
            display: none;
        }

        /* Admin Panel */
        .admin-panel {
            display: none;
        }

        .admin-nav {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 1rem;
        }

        .admin-nav button {
            background: var(--dark-gray);
            color: var(--light-gray);
            border: 2px solid transparent;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-family: var(--serif);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .admin-nav button.active {
            color: var(--gold);
            border-bottom: 2px solid var(--gold);
        }

        .admin-nav button:hover {
            color: var(--gold);
        }

        /* Sections */
        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
        }

        .section-title {
            color: var(--gold);
            font-size: 1.8rem;
            margin-bottom: 2rem;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--light-gray);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: var(--dark-gray);
            color: var(--light-gray);
            border: 1px solid #444;
            border-radius: 4px;
            font-family: var(--serif);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            background: var(--success);
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--serif);
            font-size: 1rem;
        }

        .submit-btn:hover {
            background: #45a049;
        }

        /* Artworks List */
        .artworks-list {
            display: grid;
            gap: 1.5rem;
        }

        .artwork-card {
            background: var(--dark-gray);
            padding: 1.5rem;
            border-left: 4px solid var(--gold);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .artwork-info h3 {
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .artwork-info p {
            color: #aaa;
            font-size: 0.9rem;
        }

        .artwork-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-edit, .btn-delete {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--serif);
        }

        .btn-edit {
            background: #2196F3;
            color: white;
        }

        .btn-edit:hover {
            background: #0b7dda;
        }

        .btn-delete {
            background: var(--error);
            color: white;
        }

        .btn-delete:hover {
            background: #d32f2f;
        }

        /* Status Message */
        .status-message {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            display: none;
        }

        .status-message.success {
            background: var(--success);
            color: white;
        }

        .status-message.error {
            background: var(--error);
            color: white;
        }

        .status-message.show {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .artwork-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .artwork-actions {
                width: 100%;
                margin-top: 1rem;
            }

            .admin-nav {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h2>Muselio Admin</h2>
            <div class="form-group">
                <label>Identifiant</label>
                <input type="text" id="username" placeholder="Votre identifiant">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="Votre mot de passe">
            </div>
            <button class="login-btn" onclick="login()">Connexion</button>
            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-panel">
        <div class="container">
            <header>
                <h1>Muselio - Gestion des Œuvres</h1>
                <button class="logout-btn" onclick="logout()">Déconnexion</button>
            </header>

            <div class="admin-nav">
                <button class="nav-btn active" onclick="showSection('add')">➕ Ajouter une Œuvre</button>
                <button class="nav-btn" onclick="showSection('list')">📋 Voir toutes les Œuvres</button>
                <button class="nav-btn" onclick="showSection('export')">📥 Exporter les Données</button>
            </div>

            <!-- Add Artwork Section -->
            <div id="addSection" class="admin-section active">
                <h2 class="section-title">Ajouter une Nouvelle Œuvre</h2>
                <div id="addStatus" class="status-message"></div>
                <form id="addForm" onsubmit="addArtwork(event)">
                    <div class="form-group">
                        <label>Titre de l'Œuvre</label>
                        <input type="text" id="addTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Artiste</label>
                        <input type="text" id="addArtist" required>
                    </div>
                    <div class="form-group">
                        <label>Année</label>
                        <input type="number" id="addYear" required>
                    </div>
                    <div class="form-group">
                        <label>URL de l'Image</label>
                        <input type="url" id="addImage" required>
                    </div>
                    <div class="form-group">
                        <label>Musée / Source</label>
                        <input type="text" id="addMuseum" required>
                    </div>
                    <div class="form-group">
                        <label>Lien vers l'Œuvre</label>
                        <input type="url" id="addUrl" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="addDescription"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Ajouter l'Œuvre</button>
                </form>
            </div>

            <!-- List Artworks Section -->
            <div id="listSection" class="admin-section">
                <h2 class="section-title">Toutes les Œuvres</h2>
                <div id="artworksList" class="artworks-list"></div>
            </div>

            <!-- Export Section -->
            <div id="exportSection" class="admin-section">
                <h2 class="section-title">Exporter les Données</h2>
                <p>Cliquez sur le bouton ci-dessous pour télécharger toutes vos données en format JSON:</p>
                <button class="submit-btn" onclick="exportData()" style="margin-top: 1rem;">📥 Télécharger JSON</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'muselio_artworks';
        const SESSION_KEY = 'muselio_session';

        // Credentials (hashed - en production, utiliser un backend)
        const VALID_USERNAME = 'lounesbouzoua';
        const VALID_PASSWORD_HASH = btoa('Muselio2026Admin!'); // Base64 simple

        // Check session on load
        window.addEventListener('load', () => {
            if (sessionStorage.getItem(SESSION_KEY)) {
                showAdminPanel();
                loadArtworks();
            }
        });

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            if (username === VALID_USERNAME && btoa(password) === VALID_PASSWORD_HASH) {
                sessionStorage.setItem(SESSION_KEY, 'authenticated');
                showAdminPanel();
                loadArtworks();
            } else {
                errorDiv.textContent = '❌ Identifiant ou mot de passe incorrect';
                errorDiv.style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function showAdminPanel() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        }

        function showSection(sectionId) {
            // Hide all sections
            document.querySelectorAll('.admin-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            // Show selected section
            document.getElementById(sectionId + 'Section').classList.add('active');
            event.target.classList.add('active');

            if (sectionId === 'list') {
                loadArtworks();
            }
        }

        function addArtwork(e) {
            e.preventDefault();

            const artwork = {
                id: Date.now(),
                title: document.getElementById('addTitle').value,
                artist: document.getElementById('addArtist').value,
                year: parseInt(document.getElementById('addYear').value),
                image: document.getElementById('addImage').value,
                museum: document.getElementById('addMuseum').value,
                url: document.getElementById('addUrl').value,
                description: document.getElementById('addDescription').value
            };

            let artworks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            artworks.push(artwork);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(artworks));

            showStatus('addStatus', '✅ Œuvre ajoutée avec succès!', 'success');
            document.getElementById('addForm').reset();

            setTimeout(() => {
                document.getElementById('addStatus').classList.remove('show');
            }, 3000);
        }

        function loadArtworks() {
            const artworks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const listDiv = document.getElementById('artworksList');

            if (artworks.length === 0) {
                listDiv.innerHTML = '<p>Aucune œuvre pour le moment. Commencez par en ajouter!</p>';
                return;
            }

            listDiv.innerHTML = artworks.map(artwork => `
                <div class="artwork-card">
                    <div class="artwork-info">
                        <h3>${artwork.title}</h3>
                        <p><strong>Artiste:</strong> ${artwork.artist}</p>
                        <p><strong>Année:</strong> ${artwork.year}</p>
                        <p><strong>Musée:</strong> ${artwork.museum}</p>
                        <p>${artwork.description}</p>
                    </div>
                    <div class="artwork-actions">
                        <button class="btn-edit" onclick="editArtwork(${artwork.id})">✏️ Modifier</button>
                        <button class="btn-delete" onclick="deleteArtwork(${artwork.id})">🗑️ Supprimer</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteArtwork(id) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cette œuvre?')) {
                let artworks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                artworks = artworks.filter(a => a.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(artworks));
                loadArtworks();
                showStatus('listSection', '✅ Œuvre supprimée!', 'success');
            }
        }

        function editArtwork(id) {
            alert('La fonction de modification sera disponible dans la prochaine version.');
        }

        function exportData() {
            const artworks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const dataStr = JSON.stringify(artworks, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'muselio-artworks-' + new Date().toISOString().split('T')[0] + '.json';
            link.click();
        }

        function showStatus(elementId, message, type) {
            const el = document.getElementById(elementId) || createStatusDiv(elementId);
            el.textContent = message;
            el.className = `status-message ${type} show`;
        }

        function createStatusDiv(id) {
            const div = document.createElement('div');
            div.id = id;
            div.className = 'status-message';
            document.querySelector('.admin-section').prepend(div);
            return div;
        }

        // Load initial data from gallery-data.json
        async function loadInitialData() {
            try {
                const response = await fetch('gallery-data.json');
                const data = await response.json();
                if (data.artworks && !localStorage.getItem(STORAGE_KEY)) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data.artworks));
                }
            } catch (e) {
                console.log('Note: gallery-data.json not loaded on first use');
            }
        }

        loadInitialData();
    </script>
</body>
</html>
