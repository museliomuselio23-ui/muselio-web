# Muselio — site statique (galerie d'art domaine public)
# Publication directe de la racine, aucune étape de build.

[build]
  command = ""
  publish = "."

# Les en-têtes de sécurité sont fournis par le fichier _headers.
# Cache long pour les assets statiques.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/galerie/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Empêcher l'exposition publique des dossiers internes (docs/scripts/worker).
[[redirects]]
  from = "/server/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
